<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>沙・光箱 · Sand Lightbox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  body{
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }

  /* 3. 修復 Fullscreen 比例變形：使用滿版視窗與 object-fit: cover */
  #c{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    width:100dvw;
    height:100dvh;
    display:block;
    object-fit:cover;
    touch-action:none;
    filter:saturate(.94) contrast(1.03);
    transition:filter .6s ease, transform .15s ease;
  }
  #c.wind-active{
    filter:saturate(.89) contrast(.99) blur(0.45px);
  }

  #frame{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 90px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.9);
  }

  /* 敘事字幕與互動確認按鈕容器 */
  #capWrap{
    position:fixed;
    top:13%;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    width:max-content;
    max-width:calc(100% - 48px);
    isolation:isolate;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  #capWrap::before{
    content:"";
    position:absolute;
    inset:-28px -54px;
    z-index:-1;
    pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(12,9,7,.68) 0%,rgba(12,9,7,.35) 46%,transparent 78%);
    filter:blur(8px);
  }
  #cap{
    color:#fff3df;
    font-size:clamp(20px,2.4vw,26px);
    font-weight:500;
    letter-spacing:1.5px;
    line-height:1.85;
    padding:12px 22px;
    text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.62);
    transition:filter .6s ease,opacity 1.1s ease;
    overflow-wrap:anywhere;
  }
  #cap:empty{display:none}

  #capBtns{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    pointer-events:auto;
  }
  #capBtns button,#doneBtn,#resetBtn{
    background:rgba(22,18,14,.94);
    color:#fff8ed;
    border:1px solid rgba(255,233,196,.45);
    border-radius:18px;
    padding:10px 24px;
    min-height:44px;
    font-size:15px;
    font-weight:500;
    letter-spacing:2px;
    box-shadow:0 4px 18px rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    touch-action:manipulation;
    transition:opacity .45s ease,transform .45s ease,visibility .45s ease,background .25s ease;
  }
  #capBtns button:active,#doneBtn:active,#resetBtn:active{
    background:rgba(255,190,110,.28);
  }
  #capBtns button:focus-visible,#doneBtn:focus-visible,#resetBtn:focus-visible{
    outline:2px solid #fff8ed;
    outline-offset:4px;
  }

  /* 選擇「還沒，繼續」後顯示於左上角的「完成了」按鈕 */
  #doneBtn{
    position:fixed;
    top:max(14px,env(safe-area-inset-top));
    left:max(16px,env(safe-area-inset-left));
    z-index:12;
    padding:8px 18px;
    font-size:14px;
    display:none;
  }

  /* 階段五：明確的結束並重置按鈕 */
  #resetBtn{
    position:fixed;
    top:max(14px,env(safe-area-inset-top));
    right:max(16px,env(safe-area-inset-right));
    z-index:12;
    padding:10px 18px;
    font-size:14px;
    letter-spacing:1.5px;
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px);
  }
  #resetBtn.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  #toast{
    position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(20,17,14,.88);color:#ffd9a0;padding:10px 20px;border-radius:14px;
    font-size:14px;letter-spacing:1px;opacity:0;transition:opacity .4s;
    pointer-events:none;max-width:82%;text-align:center;line-height:1.7;
  }

  /* 底部工具列（已徹底移除 📷儲存 按鈕） */
  #bar{
    position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));z-index:10;
    transform:translateX(-50%);display:flex;align-items:center;gap:4px;
    background:rgba(20,17,14,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:8px 10px;border-radius:22px;border:1px solid rgba(255,255,255,.09);
    transition:transform .35s,opacity .35s;
  }
  #bar.hidden{transform:translateX(-50%) translateY(calc(100% + 40px));opacity:0;pointer-events:none}
  #bar button{
    min-width:54px;padding:6px 6px;border-radius:14px;background:transparent;border:none;
    color:#cfc6b8;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:pointer;touch-action:manipulation;
  }
  #bar button span{font-size:11px;letter-spacing:2px}
  #bar button.on{background:rgba(255,190,110,.22);color:#ffd9a0}
  .sep{width:1px;height:40px;background:rgba(255,255,255,.12);margin:0 4px}
  .lightWrap{display:flex;flex-direction:column;align-items:center;gap:2px;color:#cfc6b8;font-size:15px}
  .lightWrap span{font-size:11px;letter-spacing:2px}
  #lightRange{width:100px;accent-color:#ffbf78}
  #showTab{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(80px);z-index:10;
    background:rgba(20,17,14,.78);color:#ffd9a0;border:1px solid rgba(255,255,255,.09);
    border-radius:16px;padding:8px 18px;font-size:14px;letter-spacing:2px;
    transition:transform .35s;cursor:pointer;touch-action:manipulation;
  }
  #showTab.show{transform:translateX(-50%) translateY(0)}
  #err{
    position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    color:#e8dcc8;font-size:16px;text-align:center;padding:40px;line-height:1.8;
  }

  /* 4. 優化橫放提示遮罩：支援平滑淡入淡出 */
  #rotateNotice{
    position:fixed;
    inset:0;
    z-index:1000;
    background:#17130f;
    color:#fff4e2;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    line-height:1.9;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .45s ease,visibility .45s ease;
  }
  #rotateNotice.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  #rotateNotice strong{display:block;font-size:26px;margin-bottom:16px}
  #rotateNotice p{max-width:24em;font-size:18px;color:#e3d4c0}

  @media (max-height:500px) and (orientation:landscape){
    #capWrap{top:52px;max-width:calc(100% - 100px);gap:8px}
    #cap{font-size:20px;line-height:1.55;padding:6px 14px}
    #capBtns button{padding:8px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    #capWrap,#rotateNotice,#resetBtn{transition:none}
  }
</style>
</head>
<body>
<div id="rotateNotice" role="status" aria-live="polite">
  <div>
    <strong>請將裝置橫放</strong>
    <p>《沙・光箱》以橫向畫面體驗。<br>直放時會暫停，橫放後即可繼續。<br>你的沙畫會保留。</p>
  </div>
</div>

<canvas id="c"></canvas>
<div id="frame"></div>
<div id="capWrap"><div id="cap"></div><div id="capBtns"></div></div>
<button id="doneBtn" type="button">完成了</button>
<button id="resetBtn" type="button">🔄 結束並重置 (給下一位)</button>
<div id="toast"></div>

<div id="bar">
  <button class="tool on" data-tool="push" type="button">✋<span>推沙</span></button>
  <button class="tool" data-tool="pour" type="button">⏳<span>灑沙</span></button>
  <div class="sep"></div>
  <button id="fillBtn" type="button">🌘<span>鋪沙</span></button>
  <button id="clearBtn" type="button">🗑️<span>清空</span></button>
  <button id="fsBtn" type="button">⛶<span>全螢幕</span></button>
  <div class="sep"></div>
  <div class="lightWrap">💡<input id="lightRange" type="range" min="0" max="100" value="30"><span>燈光</span></div>
  <button id="hideBtn" type="button">▾<span>收起</span></button>
</div>
<button id="showTab" type="button">🛠️ 工具</button>
<div id="err"></div>

<script>
"use strict";
/* ================= 可調參數 ================= */
const CONFIG = {
  SIM_MAX: 896,             // 沙層模擬網格的最大邊長
  TALUS: 0.008,             // 安息角：越大沙堆越穩定
  FLOW: 0.08,               // 沙流動的速度（穩定上限 0.25）
  RELAX_STEPS: 3,           // 每幀鬆弛迭代次數
  SETTLE_RATE: 0.0,         // 自然沉降速率
  BRUSH_R: 0.05,            // 筆刷半徑（螢幕短邊比例）
  PUSH: 0.9,                // 推沙強度
  POUR: 1.3,                // 灑沙速率
  BASE: 0.12,               // 鋪沙的基礎厚度
  BASE_NOISE: 0.02,         // 鋪沙的不均勻度
  ABSORB: 6.0,              // 燈箱吸光係數：越大對比越強
  DRAW_TIME: 20.0,          // 作畫滿 20 秒後詢問是否完成
  AMBIENT_GUST_DUR: 3.6,    // 作畫中途輕微風動持續秒數
  AMBIENT_GUST_STR: 0.26,   // 作畫中途微風力度（輕柔微動，不破壞畫作）
  WIND_DUR: 5.8,            // 確認完成後階段二大風持續秒數
  MAIN_WIND_STR: 1.65,      // 確認完成後階段二大風力度
  STAGE3_PUSH_NEED: 0.45    // 階段三引導撥開沙層所需累積秒數
};

/* ================= 五階段互動敘事與精確文案 ================= */
const STAGE = {
  STAGE_1: 1, // 階段一：珍視與建構 (沙的凝聚 + 20秒確認是否完成)
  STAGE_2: 2, // 階段二：脆弱與消散 (沙的不可控 — 確認完成後吹大風)
  STAGE_3: 3, // 階段三：發現與恆常 (推沙見光)
  STAGE_4: 4, // 階段四：立意昇華 (神永恆的光)
  STAGE_5: 5  // 階段五：自由發揮與重置 (結束流程)
};

const TEXTS = {
  STAGE_1_INIT: '請在心中想起那些你重視的人、事、物。',
  STAGE_1_DRAW: '試著用沙，將它們描繪或寫出來……',
  STAGE_1_ASK: '完成了嗎？\n這是否你珍視、想留住的畫面？',
  STAGE_1_MORE: '慢慢來，不急。',
  STAGE_2_WIND: '我們緊緊抓著、努力守護的，終究如沙般脆弱，總是不由自主地消散……',
  STAGE_3_PROMPT: '請輕輕撥開沙層，看看底下。',
  STAGE_3_LIGHT: '無論沙如何聚散，底下的光，一直都在，從未改變。',
  STAGE_4_GOD_1: '沙會散去，但神，也就是那道永恆的光卻從不離開。',
  STAGE_4_GOD_2: '在神的眼中，你就是這道光所照耀的珍貴存在。',
  STAGE_5_FREE: '歡迎自由創作',
  RESET_BTN: '🔄 結束並重置 (給下一位)'
};
/* ============================================================ */

const canvas = document.getElementById('c');
const errBox = document.getElementById('err');
const rotateNotice = document.getElementById('rotateNotice');
const capWrap = document.getElementById('capWrap');
const cap = document.getElementById('cap');
const capBtns = document.getElementById('capBtns');
const doneBtn = document.getElementById('doneBtn');
const resetBtn = document.getElementById('resetBtn');
const bar = document.getElementById('bar');
const showTab = document.getElementById('showTab');
const toastEl = document.getElementById('toast');

resetBtn.textContent = TEXTS.RESET_BTN;

function fail(msg){
  errBox.style.display = 'flex';
  errBox.textContent = msg;
  throw new Error(msg);
}

/* ---------- 裝置橫向偵測與計時器 ---------- */
function isLandscapeScreen(){
  if(window.innerWidth !== window.innerHeight){
    return window.innerWidth > window.innerHeight;
  }
  if(window.screen && window.screen.orientation && typeof window.screen.orientation.type === 'string'){
    return window.screen.orientation.type.startsWith('landscape');
  }
  return true;
}

let portraitPaused = !isLandscapeScreen();
let activeTime = 0;
let clockLast = performance.now();
function experienceNow(){
  const now = performance.now();
  if(!portraitPaused) activeTime += Math.max(0, now - clockLast);
  clockLast = now;
  return activeTime;
}
let experienceStarted = false;

/* ---------- WebGL2 初始化 ---------- */
const gl = canvas.getContext('webgl2', {
  alpha: false,
  antialias: false,
  depth: false,
  stencil: false,
  powerPreference: 'high-performance'
});
if(!gl) fail('此瀏覽器不支援 WebGL2。請將 iPad 更新到 iPadOS 15 以上，或使用 Safari。');
const useFloat = !!gl.getExtension('EXT_color_buffer_float');

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader 錯誤: ' + gl.getShaderInfoLog(s));
  return s;
}
function prog(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link 錯誤: ' + gl.getProgramInfoLog(p));
  return p;
}
function locs(p, names){
  const o = {};
  names.forEach(n => o[n] = gl.getUniformLocation(p, n));
  return o;
}

const VS = "#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.,1.);}";

/* ---------- 沙層模擬 Shader（區分中途輕柔微風 vs 階段二強風吹散） ---------- */
const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform vec2  uSimSize;
uniform vec2  uWind;       // 風向*強度
uniform float uTalus, uFlow, uTime, uDt, uSettleRate, uBase, uWindMain;
uniform int   uCount;
uniform vec4  uBrush[10];
uniform vec4  uBrushPrev[10];
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float windFlux(vec2 cell, float strength){
  if(any(lessThan(cell,vec2(0.5))) || any(greaterThan(cell,uSimSize-0.5))) return 0.0;
  float h=texture(uPrev,cell/uSimSize).r;
  float upstream=texture(uPrev,(cell-vec2(2.,0.))/uSimSize).r;
  float ridge=smoothstep(0.,0.045,max(0.,h-upstream));
  float bands=0.45+0.55*pow(0.5+0.5*sin(cell.y*0.075+sin(cell.y*0.021)+uTime*0.6),2.);
  float gust=0.65+0.35*sin(cell.x*0.023-uTime*2.4+cell.y*0.013);
  float rate=min(0.14, strength*uDt*(2.2+ridge*6.0)*bands*gust);
  return h*rate;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uSimSize;
  vec2 tx = 1.0/uSimSize;
  float h  = texture(uPrev, uv).r;
  float hN = texture(uPrev, uv+vec2(0.,tx.y)).r;
  float hS = texture(uPrev, uv-vec2(0.,tx.y)).r;
  float hE = texture(uPrev, uv+vec2(tx.x,0.)).r;
  float hW = texture(uPrev, uv-vec2(tx.x,0.)).r;

  // 安息角鬆弛
  float fN=max(0.,h-hN-uTalus), fS=max(0.,h-hS-uTalus);
  float fE=max(0.,h-hE-uTalus), fW=max(0.,h-hW-uTalus);
  float outSum=fN+fS+fE+fW;
  float cap = outSum>h ? h/outSum : 1.0;
  float iN=min(hN,max(0.,hN-h-uTalus)), iS=min(hS,max(0.,hS-h-uTalus));
  float iE=min(hE,max(0.,hE-h-uTalus)), iW=min(hW,max(0.,hW-h-uTalus));
  float nh = h - uFlow*cap*outSum + uFlow*(iN+iS+iE+iW);

  vec2 px = uv*uSimSize;

  // 自然沉降
  float slope=max(max(h-hN,h-hS),max(h-hE,h-hW));
  float unstable=smoothstep(uTalus*0.35,uTalus*1.8,slope);
  float field=hash21(floor(px*0.22)+floor(uTime*0.55)*17.3);
  float settle=unstable*step(0.72,field)*uSettleRate*uDt;
  if(settle>0.0){
    vec2 down=normalize(vec2((hW-hE),(hS-hN))+vec2(0.0001));
    vec2 src=clamp(uv-down*tx*(0.8+field*2.2),vec2(0.002),vec2(0.998));
    float incoming=texture(uPrev,src).r;
    nh=mix(nh,incoming,settle*8.0);
  }

  float wlen = length(uWind);
  if(wlen > 0.001){
    if(uWindMain < 0.5){
      // 作畫中途的微風：只輕微吹動沙脊表層顆粒，力度溫和、不覆蓋或破壞畫作
      vec2 hop = vec2(2.0, 0.0);
      float outgoing = px.x+hop.x<=uSimSize.x-0.5 ? windFlux(px, wlen) : 0.0;
      float incoming = windFlux(px-hop, wlen);
      nh = max(0.0, nh + incoming - outgoing);
      float avg4 = (hN+hS+hE+hW)*0.25;
      nh = mix(nh, avg4, clamp(0.035 * wlen, 0.0, 0.04));
    } else {
      // 階段二確認完成後的大風：平流拉絲 + 方向擴散模糊 + 飛沙回填溝槽
      vec2 wdir = uWind / wlen;
      float gust   = hash21(floor(px*0.045) + floor(uTime*3.5)*7.7);
      float streak = hash21(floor(px*vec2(0.08, 0.32)));
      float speed  = (0.5 + 1.4*streak) * (0.6 + 0.9*gust);

      vec2 off = wdir * speed * 2.5 * wlen;
      float phase = px.x*0.028 + px.y*0.012 - uTime*5.0;
      off.y += sin(phase) * (0.55 + 1.2*streak) * wlen;
      off.x += sin(phase*0.7 + 1.7) * 0.5 * wlen;
      float adv = texture(uPrev, clamp((px - off)/uSimSize, vec2(0.002), vec2(0.998))).r;

      float b1 = texture(uPrev, clamp(uv - wdir*tx*3.2*wlen, vec2(0.002), vec2(0.998))).r;
      float b2 = texture(uPrev, clamp(uv - wdir*tx*7.5*wlen + vec2(0.0, tx.y*2.2), vec2(0.002), vec2(0.998))).r;
      float b3 = texture(uPrev, clamp(uv - wdir*tx*12.0*wlen - vec2(0.0, tx.y*2.2), vec2(0.002), vec2(0.998))).r;
      float blurH = (adv*0.44 + b1*0.26 + b2*0.18 + b3*0.12);
      nh = mix(nh, blurH, clamp(0.48 * wlen, 0.0, 0.78));

      float duneWave = 0.5 + 0.5*sin(px.x*0.06 - uTime*6.5 + sin(px.y*0.04)*2.5);
      float flyGrain = hash21(floor(px*0.5) + floor(uTime*24.0)*5.3);
      float targetCover = uBase * (0.76 + 0.26*duneWave + (flyGrain - 0.5)*0.18);
      float fillRate = clamp(0.022 * wlen * (0.45 + 0.55*streak), 0.0, 0.07);
      nh = mix(nh, targetCover, fillRate);
    }
  }

  // 手指筆刷
  for(int i=0;i<10;i++){
    if(i>=uCount) break;
    vec4 b=uBrush[i], bp=uBrushPrev[i];
    vec2 c=b.xy*uSimSize, cp=bp.xy*uSimSize;
    float rad=b.z, str=b.w;
    int mode=int(bp.z+0.5);
    vec2 ba=c-cp;
    float tt=clamp(dot(px-cp,ba)/max(dot(ba,ba),1e-4),0.,1.);
    float dist=length(px-(cp+ba*tt));
    float fall=1.0-smoothstep(rad*0.3, rad, dist);
    if(fall<=0.001) continue;
    if(mode==0){
      float mv=clamp(length(ba)*0.15, 0., 1.);
      float moving=clamp(mv*8.0, 0., 1.);
      float act=str*moving*(0.35+0.65*clamp(mv*3.0,0.,1.));
      float dn=dist/rad;
      float core=1.0-smoothstep(0.15,0.8,dn);
      float ring=smoothstep(0.5,0.75,dn)*(1.0-smoothstep(0.8,1.0,dn));
      nh *= 1.0 - core*act;
      nh += ring*act*0.28*h;
    } else {
      float g=hash21(px*0.9+floor(uTime*50.)*13.7);
      float grain=smoothstep(0.35,0.8,g);
      nh+=str*fall*grain*uDt;
    }
  }
  o=vec4(clamp(nh,0.,2.5),0.,0.,1.);
}`;

/* ---------- 燈箱渲染 Shader（修正寬高比與階段三/四透光增強） ---------- */
const REND_FS = `#version 300 es
precision highp float;
uniform sampler2D uHeight;
uniform vec2  uCanvas, uSimSize;
uniform vec3  uLight;
uniform float uTime, uAbsorb, uLightBoost;
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
vec2 aspectCoverUV(vec2 fragCoord, vec2 canvasSize, vec2 simSize){
  float cAsp = canvasSize.x / max(1.0, canvasSize.y);
  float sAsp = simSize.x / max(1.0, simSize.y);
  vec2 uv = fragCoord / canvasSize;
  if(abs(cAsp - sAsp) < 0.005) return uv;
  vec2 centered = uv - 0.5;
  if(cAsp > sAsp){
    centered.y *= sAsp / cAsp;
  } else {
    centered.x *= cAsp / sAsp;
  }
  return clamp(centered + 0.5, vec2(0.001), vec2(0.999));
}
void main(){
  vec2 uv = aspectCoverUV(gl_FragCoord.xy, uCanvas, uSimSize);
  vec2 tx = 1.0/uSimSize;
  float h  = texture(uHeight, uv).r;
  float hE = texture(uHeight, uv+vec2(tx.x,0.)).r;
  float hW = texture(uHeight, uv-vec2(tx.x,0.)).r;
  float hN = texture(uHeight, uv+vec2(0.,tx.y)).r;
  float hS = texture(uHeight, uv-vec2(0.,tx.y)).r;
  float hb = (texture(uHeight,uv+tx*1.5).r+texture(uHeight,uv-tx*1.5).r
             +texture(uHeight,uv+vec2(tx.x,-tx.y)*1.5).r+texture(uHeight,uv+vec2(-tx.x,tx.y)*1.5).r)*0.25;
  float hh = mix(h,hb,0.25);

  float presence = smoothstep(0.004,0.05,h);

  vec2 grad = vec2(hE-hW, hN-hS);
  vec3 n = normalize(vec3(-grad*50.0, 1.0));
  vec3 L = normalize(vec3(-0.45,0.5,0.62));
  float diff = clamp(dot(n,L), 0., 1.);

  vec2 ld = normalize(vec2(-0.55,0.7));
  float s1 = max(0.0, texture(uHeight, uv+ld*tx*2.0).r - h);
  float s2 = max(0.0, texture(uHeight, uv+ld*tx*5.0).r - h);
  float s3 = max(0.0, texture(uHeight, uv+ld*tx*9.0).r - h);
  float shadow = 1.0 - clamp((s1 + s2*0.7 + s3*0.45)*18.0, 0.0, 0.5);

  float effAbsorb = uAbsorb * (1.0 - 0.16 * uLightBoost);
  float intensity = (0.05 + 0.05 * uLightBoost) + (1.35 + 0.25 * uLightBoost) * exp(-effAbsorb * hh);
  vec3 col = uLight * intensity;
  col *= mix(vec3(1.0), vec3(0.86,0.78,0.66), presence*0.85);
  col *= mix(1.0, 0.7+0.6*diff, presence);
  col *= mix(1.0, shadow, presence);
  col += uLight * exp(-effAbsorb*hb) * (0.25 + 0.14 * uLightBoost) * (1.0 - 0.6*presence);

  vec2 gp = uv*uSimSize;
  float g = hash21(floor(gp));
  float fine = hash21(floor(gp*2.7+vec2(13.1,7.4)));
  col *= 1.0 + (g-0.5)*0.22*presence;
  col *= 1.0 + (fine-0.5)*0.055*presence;
  float sp = hash21(floor(gp)+floor(uTime*7.0)*7.13);
  float tw = 0.5+0.5*sin(uTime*4.0+sp*60.0);
  col += uLight * step(0.997,sp)*tw*presence*0.8;

  col *= 0.94 + 0.06*sin(uv.x*3.7+1.0)*sin(uv.y*2.9+2.0);
  float d = distance(uv, vec2(0.5));
  col *= 1.0 - (0.32 - 0.08 * uLightBoost)*smoothstep(0.45,0.85,d);
  col = pow(col, vec3(0.9));
  o = vec4(col,1.0);
}`;

/* ---------- 鋪沙 Shader ---------- */
const FILL_FS = `#version 300 es
precision highp float;
uniform float uBase,uAmp,uSeed;
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1.,0.)), c=hash21(i+vec2(0.,1.)), d=hash21(i+vec2(1.,1.));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
void main(){
  vec2 p=gl_FragCoord.xy;
  float m1=vnoise(p*0.05+uSeed);
  float m2=vnoise(p*0.22+uSeed*2.7);
  float g =hash21(p+uSeed);
  float h=uBase + (m1-0.5)*uAmp*3.0 + (m2-0.5)*uAmp*1.2 + (g-0.5)*uAmp*0.7;
  o=vec4(max(h,0.0),0.,0.,1.);
}`;

/* ---------- 等比例複製 Shader（Resize / Fullscreen 時不變形） ---------- */
const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc;
uniform vec2 uSrcSize;
uniform vec2 uDest;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uDest;
  float dAsp = uDest.x / max(1.0, uDest.y);
  float sAsp = uSrcSize.x / max(1.0, uSrcSize.y);
  vec2 centered = uv - 0.5;
  if(dAsp > sAsp){
    centered.y *= sAsp / dAsp;
  } else {
    centered.x *= dAsp / sAsp;
  }
  vec2 sampleUV = clamp(centered + 0.5, vec2(0.001), vec2(0.999));
  o = vec4(texture(uSrc, sampleUV).r, 0., 0., 1.);
}`;

const sp = prog(VS, SIM_FS),  SL = locs(sp, ['uPrev','uSimSize','uWind','uTalus','uFlow','uTime','uDt','uCount','uBrush','uBrushPrev','uSettleRate','uBase','uWindMain']);
const rp = prog(VS, REND_FS), RL = locs(rp, ['uHeight','uCanvas','uSimSize','uLight','uTime','uAbsorb','uLightBoost']);
const fp = prog(VS, FILL_FS), FL = locs(fp, ['uBase','uAmp','uSeed']);
const cp = prog(VS, COPY_FS), CL = locs(cp, ['uSrc','uSrcSize','uDest']);

/* ---------- 紋理 / 幀緩衝與 Resize 處理 ---------- */
let simW = 0, simH = 0, tex = null, ri = 0;

function makeTarget(){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(useFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, simW, simH, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else         gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, simW, simH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail('Framebuffer 不完整');
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex: t, fbo: f, w: simW, h: simH};
}

function fillTarget(tgt, seed){
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgt.fbo);
  gl.viewport(0, 0, simW, simH);
  gl.useProgram(fp);
  gl.uniform1f(FL.uBase, CONFIG.BASE);
  gl.uniform1f(FL.uAmp, CONFIG.BASE_NOISE);
  gl.uniform1f(FL.uSeed, seed);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function copyInto(src, dst){
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, simW, simH);
  gl.useProgram(cp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(CL.uSrc, 0);
  gl.uniform2f(CL.uSrcSize, src.w || simW, src.h || simH);
  gl.uniform2f(CL.uDest, simW, simH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function fillBoth(seed = 1.0){
  if(!tex) return;
  fillTarget(tex[0], seed);
  fillTarget(tex[1], seed);
}

function clearAll(){
  if(!tex) return;
  for(const t of tex){
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
}

function initSimSize(){
  const vw = Math.max(1, window.innerWidth);
  const vh = Math.max(1, window.innerHeight);
  const aspect = vw / vh;
  if(aspect >= 1){
    simW = CONFIG.SIM_MAX;
    simH = Math.max(64, Math.round(CONFIG.SIM_MAX / aspect));
  } else {
    simH = CONFIG.SIM_MAX;
    simW = Math.max(64, Math.round(CONFIG.SIM_MAX * aspect));
  }
}

function rebuildSim(keep){
  const old = tex, oldRi = ri;
  initSimSize();
  tex = [makeTarget(), makeTarget()];
  ri = 0;
  if(keep && old){
    copyInto(old[oldRi], tex[0]);
    copyInto(tex[0], tex[1]);
    old.forEach(t => {
      gl.deleteTexture(t.tex);
      gl.deleteFramebuffer(t.fbo);
    });
  } else {
    fillBoth(1.0 + Math.random() * 10.0);
    if(old){
      old.forEach(t => {
        gl.deleteTexture(t.tex);
        gl.deleteFramebuffer(t.fbo);
      });
    }
  }
}

/* 3. 修復 Fullscreen 與 Resize 時 Canvas 寬高計算 */
function resizeCanvas(){
  canvas.style.width = '';
  canvas.style.height = '';
  canvas.style.left = '';
  canvas.style.top = '';
  canvas.style.right = '';
  canvas.style.bottom = '';

  const rect = canvas.getBoundingClientRect();
  const cssW = Math.max(1, Math.round(rect.width || window.innerWidth));
  const cssH = Math.max(1, Math.round(rect.height || window.innerHeight));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(cssW * dpr);
  let h = Math.round(cssH * dpr);
  const capPx = 3500000;
  if(w * h > capPx){
    const s = Math.sqrt(capPx / (w * h));
    w = Math.max(1, Math.round(w * s));
    h = Math.max(1, Math.round(h * s));
  }
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w;
    canvas.height = h;
  }
}

/* ---------- 多點觸控與手勢偵測 ---------- */
const pointers = new Map();
let tool = 'push';
const TOOL_ID = {push: 0, pour: 1};

function setTool(nextTool){
  tool = nextTool;
  document.querySelectorAll('#bar .tool').forEach(x => {
    x.classList.toggle('on', x.dataset.tool === tool);
  });
}

function toUV(e){
  const r = canvas.getBoundingClientRect();
  const u = (e.clientX - r.left) / Math.max(1, r.width);
  const v = 1 - (e.clientY - r.top) / Math.max(1, r.height);
  return {u: Math.min(1, Math.max(0, u)), v: Math.min(1, Math.max(0, v))};
}

let hasStartedDrawingInStage1 = false;
let stage1DrawStartTime = 0;   // 階段一首次下筆作畫的時間點（秒）
let drawingPhase = false;      // 是否處於階段一作畫期間
let finishRequested = false;   // 使用者是否已按「完成了」

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(portraitPaused || !experienceStarted) return;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  const {u, v} = toUV(e);
  pointers.set(e.pointerId, {u, v, pu: u, pv: v, moved: 0});

  const nowSec = experienceNow() / 1000;

  // 階段一：使用者開始觸碰作畫時，啟動 20 秒計時並切換為「試著用沙，將它們描繪或寫出來……」
  if(currentStage === STAGE.STAGE_1){
    if(!stage1DrawStartTime) stage1DrawStartTime = nowSec;
    if(!hasStartedDrawingInStage1){
      hasStartedDrawingInStage1 = true;
      setCap(TEXTS.STAGE_1_DRAW);
    }
  }
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if(!p) return;
  const {u, v} = toUV(e);
  const dist = Math.hypot(u - p.u, v - p.v);
  p.moved += dist;
  p.u = u;
  p.v = v;
});

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
  canvas.addEventListener(t, e => pointers.delete(e.pointerId))
);
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- 2. 風吹邏輯：區分作畫中途輕微風動 vs 確認完成後階段二大風 ---------- */
let windStart = 0;
let ambientStart = 0;
let nextGust = 0;

function triggerWind(){
  const now = experienceNow() / 1000;
  windStart = now;
  ambientStart = 0;

  // 視覺微震與模糊回饋
  canvas.classList.add('wind-active');
  setTimeout(() => canvas.classList.remove('wind-active'), CONFIG.WIND_DUR * 1000);

  // 若裝置支援震動，提供輕微觸覺回饋
  try {
    if(navigator.vibrate) navigator.vibrate([40, 60, 80]);
  } catch(e){}

  // 疊加階段二精確文案
  setCap(TEXTS.STAGE_2_WIND);
}

function getWindState(now){
  // 1. 階段二主大風（使用者確認完成後觸發）
  if(windStart > 0){
    const t = (now - windStart) / CONFIG.WIND_DUR;
    if(t >= 1){
      windStart = 0;
      return {level: 0, isMain: 0};
    }
    if(t <= 0) return {level: 0, isMain: 0};
    const wave = Math.sin(Math.PI * t) * (0.85 + 0.35 * Math.sin(Math.PI * 3.0 * t));
    return {level: CONFIG.MAIN_WIND_STR * Math.max(0, wave), isMain: 1.0};
  }

  // 2. 作畫中途的輕柔微風（力度小，僅輕微拂動沙粒表面）
  if(drawingPhase && stage1DrawStartTime > 0){
    if(!nextGust) nextGust = stage1DrawStartTime + 7.0;
    if(!ambientStart && now >= nextGust) ambientStart = now;
    if(ambientStart > 0){
      const t = (now - ambientStart) / CONFIG.AMBIENT_GUST_DUR;
      if(t >= 1){
        ambientStart = 0;
        nextGust = now + 7.0 + Math.random() * 4.0;
        return {level: 0, isMain: 0};
      }
      return {level: CONFIG.AMBIENT_GUST_STR * Math.sin(Math.PI * Math.max(0, t)), isMain: 0.0};
    }
  }

  return {level: 0, isMain: 0};
}

/* ---------- 五階段互動敘事 State Management ---------- */
let currentStage = STAGE.STAGE_1;
let narrativeVer = 0;
let stage3PushTime = 0;
let lightBoost = 0.0;
let targetLightBoost = 0.0;

function setCap(t){
  cap.innerHTML = t.replace(/\n/g, '<br>');
  capWrap.style.opacity = '1';
}
function clearCap(){
  capWrap.style.opacity = '0';
}
function setBtns(list){
  capBtns.innerHTML = '';
  for(const [label, cb] of list){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', cb);
    capBtns.appendChild(b);
  }
}
function ask(opts){
  return new Promise(res => {
    capWrap.style.opacity = '1';
    setBtns(opts.map(o => [o[0], () => {
      setBtns([]);
      res(o[1]);
    }]));
  });
}

function waitExp(ms, ver){
  return new Promise(resolve => {
    const end = experienceNow() + ms;
    const id = setInterval(() => {
      if(ver !== narrativeVer){
        clearInterval(id);
        resolve(false);
        return;
      }
      if(!portraitPaused && experienceNow() >= end){
        clearInterval(id);
        resolve(true);
      }
    }, 60);
  });
}

function waitUntilExp(pred, ver){
  return new Promise(resolve => {
    const id = setInterval(() => {
      if(ver !== narrativeVer){
        clearInterval(id);
        resolve(false);
        return;
      }
      if(!portraitPaused && pred()){
        clearInterval(id);
        resolve(true);
      }
    }, 80);
  });
}

function finishDrawing(){
  if(currentStage !== STAGE.STAGE_1 || finishRequested) return;
  finishRequested = true;
  drawingPhase = false;
  ambientStart = 0;
  doneBtn.style.display = 'none';
  setBtns([]);
}
doneBtn.addEventListener('click', finishDrawing);

// 完整五階段互動敘事主流程
async function runNarrativeFlow(){
  const ver = ++narrativeVer;
  currentStage = STAGE.STAGE_1;
  hasStartedDrawingInStage1 = false;
  stage1DrawStartTime = 0;
  drawingPhase = true;
  finishRequested = false;
  stage3PushTime = 0;
  windStart = 0;
  ambientStart = 0;
  nextGust = 0;
  targetLightBoost = 0.0;
  setBtns([]);
  doneBtn.style.display = 'none';
  resetBtn.classList.remove('show');
  bar.classList.remove('hidden');
  showTab.classList.remove('show');

  // 階段一 (初始引導)：「請在心中想起那些你重視的人、事、物。」
  setCap(TEXTS.STAGE_1_INIT);

  // 若 3.8 秒後尚未觸碰，切換為「試著用沙，將它們描繪或寫出來……」並開始計時
  let ok = await waitExp(3800, ver);
  if(!ok || ver !== narrativeVer) return;
  if(!hasStartedDrawingInStage1){
    hasStartedDrawingInStage1 = true;
    setCap(TEXTS.STAGE_1_DRAW);
  }
  if(!stage1DrawStartTime){
    stage1DrawStartTime = experienceNow() / 1000;
  }

  // 等待作畫滿 20 秒
  ok = await waitUntilExp(() => {
    return stage1DrawStartTime > 0 && (experienceNow() / 1000 - stage1DrawStartTime) >= CONFIG.DRAW_TIME;
  }, ver);
  if(!ok || ver !== narrativeVer) return;

  // 滿 20 秒後向用戶確認是否完成
  setCap(TEXTS.STAGE_1_ASK);
  const ans = await ask([
    ['還沒，繼續', 'more'],
    ['完成了', 'done']
  ]);
  if(ver !== narrativeVer) return;

  if(ans === 'more'){
    doneBtn.style.display = 'block';
    setCap(TEXTS.STAGE_1_MORE);
    setTimeout(() => {
      if(ver === narrativeVer && drawingPhase) clearCap();
    }, 3500);
    ok = await waitUntilExp(() => finishRequested, ver);
    if(!ok || ver !== narrativeVer) return;
  } else {
    finishDrawing();
  }

  drawingPhase = false;
  ambientStart = 0;
  nextGust = 0;
  doneBtn.style.display = 'none';
  clearCap();
  ok = await waitExp(600, ver);
  if(!ok) return;

  // 階段二：確認完成後吹起大風，浮現階段二消散文案
  currentStage = STAGE.STAGE_2;
  triggerWind();
  ok = await waitExp(CONFIG.WIND_DUR * 1000 + 2200, ver);
  if(!ok) return;

  // 階段三：發現與恆常 (推沙見光)
  currentStage = STAGE.STAGE_3;
  stage3PushTime = 0;
  setTool('push'); // 自動切換為「推沙」手勢，引導使用者撥開沙層
  clearCap();
  ok = await waitExp(650, ver);
  if(!ok) return;

  setCap(TEXTS.STAGE_3_PROMPT);

  // 等待使用者撥開沙層（或 7.5 秒後自動推進），底層光線逐漸清晰
  const startWaitPush = experienceNow();
  ok = await waitUntilExp(() => {
    return stage3PushTime >= CONFIG.STAGE3_PUSH_NEED || (experienceNow() - startWaitPush) >= 7500;
  }, ver);
  if(!ok) return;

  targetLightBoost = 1.0; // 底層燈箱光芒逐漸清晰明亮
  clearCap();
  ok = await waitExp(650, ver);
  if(!ok) return;

  setCap(TEXTS.STAGE_3_LIGHT);
  ok = await waitExp(6200, ver);
  if(!ok) return;

  // 階段四：立意昇華 (神永恆的光) — 停留足夠時間讓參加者沉澱
  currentStage = STAGE.STAGE_4;
  clearCap();
  ok = await waitExp(850, ver);
  if(!ok) return;

  setCap(TEXTS.STAGE_4_GOD_1);
  ok = await waitExp(6800, ver);
  if(!ok) return;

  clearCap();
  ok = await waitExp(850, ver);
  if(!ok) return;

  setCap(TEXTS.STAGE_4_GOD_2);
  ok = await waitExp(6800, ver);
  if(!ok) return;

  // 階段五：自由發揮與重置 (結束流程) — 文案：「歡迎自由創作」
  currentStage = STAGE.STAGE_5;
  clearCap();
  ok = await waitExp(850, ver);
  if(!ok) return;

  setCap(TEXTS.STAGE_5_FREE);
  resetBtn.classList.add('show'); // 顯示「🔄 結束並重置 (給下一位)」按鈕

  // 引導文字停留後平滑淡出，進入無干擾的「自由創作模式」
  ok = await waitExp(4500, ver);
  if(!ok) return;
  clearCap();
}

// 結束並重置（給下一位參加者）
function resetExperience(){
  narrativeVer++;
  pointers.clear();
  clearAll();
  fillBoth(1.0 + Math.random() * 20.0);
  lightBoost = 0.0;
  targetLightBoost = 0.0;
  setTool('push');
  runNarrativeFlow();
}

resetBtn.addEventListener('click', resetExperience);

/* ---------- 主迴圈 ---------- */
let lastT = 0;

function step(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, tex[1 - ri].fbo);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex[ri].tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  ri = 1 - ri;
}

function render(now){
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(rp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex[ri].tex);
  gl.uniform1i(RL.uHeight, 0);
  gl.uniform2f(RL.uCanvas, canvas.width, canvas.height);
  gl.uniform2f(RL.uSimSize, simW, simH);
  gl.uniform3f(RL.uLight, lightCol[0], lightCol[1], lightCol[2]);
  gl.uniform1f(RL.uTime, now);
  gl.uniform1f(RL.uAbsorb, CONFIG.ABSORB);
  gl.uniform1f(RL.uLightBoost, lightBoost);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(nowMs){
  requestAnimationFrame(frame);
  if(portraitPaused || !experienceStarted){
    lastT = 0;
    return;
  }
  const now = experienceNow() / 1000;
  const dt = Math.min(0.033, lastT ? now - lastT : 0.016);
  lastT = now;

  // 平滑過渡底層燈箱亮度清晰度
  lightBoost += (targetLightBoost - lightBoost) * Math.min(1.0, dt * 1.8);

  // 階段三：偵測使用者撥開沙層手勢，讓底層光線逐漸清晰
  if(currentStage === STAGE.STAGE_3 && pointers.size > 0){
    stage3PushTime += dt;
    targetLightBoost = Math.min(1.0, stage3PushTime / CONFIG.STAGE3_PUSH_NEED);
  }

  const b = new Float32Array(40), bp = new Float32Array(40);
  let n = 0;
  const baseR = CONFIG.BRUSH_R * Math.min(simW, simH);
  const rad = tool === 'pour' ? baseR * 1.3 : baseR;
  const str = tool === 'push' ? CONFIG.PUSH : CONFIG.POUR;
  pointers.forEach(p => {
    if(n >= 10) return;
    b.set([p.u, p.v, rad, str], n * 4);
    bp.set([p.pu, p.pv, TOOL_ID[tool], 0], n * 4);
    n++;
  });
  pointers.forEach(p => { p.pu = p.u; p.pv = p.v; });

  const ws = getWindState(now);
  gl.useProgram(sp);
  gl.viewport(0, 0, simW, simH);
  gl.uniform1i(SL.uPrev, 0);
  gl.uniform2f(SL.uSimSize, simW, simH);
  gl.uniform2f(SL.uWind, ws.level, ws.level * 0.14);
  gl.uniform1f(SL.uWindMain, ws.isMain);
  gl.uniform1f(SL.uTalus, CONFIG.TALUS);
  gl.uniform1f(SL.uFlow, CONFIG.FLOW);
  gl.uniform1f(SL.uTime, now);
  gl.uniform1f(SL.uDt, dt);
  gl.uniform1f(SL.uSettleRate, CONFIG.SETTLE_RATE);
  gl.uniform1f(SL.uBase, CONFIG.BASE);
  gl.uniform4fv(SL.uBrush, b);
  gl.uniform4fv(SL.uBrushPrev, bp);
  gl.uniform1i(SL.uCount, n);
  step();
  gl.uniform1i(SL.uCount, 0);
  gl.uniform2f(SL.uWind, 0, 0);
  gl.uniform1f(SL.uWindMain, 0);
  for(let i = 0; i < CONFIG.RELAX_STEPS; i++) step();
  render(now);
}

/* ---------- 工具列 UI ---------- */
let toastT = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.style.opacity = '0', 3800);
}

document.querySelectorAll('#bar .tool').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});
document.getElementById('fillBtn').addEventListener('click', () => fillBoth(1.0 + Math.random() * 20.0));
document.getElementById('clearBtn').addEventListener('click', () => {
  clearAll();
  if(currentStage === STAGE.STAGE_3){
    stage3PushTime = CONFIG.STAGE3_PUSH_NEED;
    targetLightBoost = 1.0;
  }
});

/* ---------- 3. 全螢幕 API 與比例同步 ---------- */
const fsBtn = document.getElementById('fsBtn');
function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function zenFallback(){
  bar.classList.add('hidden');
  showTab.classList.add('show');
  toast('此裝置不支援網頁全螢幕，已隱藏工具列。iPhone 請用「分享 → 加入主畫面」，從主畫面開啟即為全螢幕。');
}
fsBtn.addEventListener('click', () => {
  if(fsElement()){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  const el = document.documentElement;
  let p = null;
  try {
    if(el.requestFullscreen) p = el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e){}
  if(p && p.then) p.catch(() => zenFallback());
  setTimeout(() => { if(!fsElement()) zenFallback(); }, 500);
});

let resizeTimer = null;
function syncViewportAndAspect(){
  resizeCanvas();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(!portraitPaused && experienceStarted){
      resizeCanvas();
      rebuildSim(true);
    }
  }, 150);
}

['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  window.addEventListener(ev, () => {
    const on = !!fsElement();
    fsBtn.innerHTML = (on ? '✕' : '⛶') + '<span>' + (on ? '退出' : '全螢幕') + '</span>';
    syncViewportAndAspect();
  })
);

document.getElementById('hideBtn').addEventListener('click', () => {
  bar.classList.add('hidden');
  showTab.classList.add('show');
});
showTab.addEventListener('click', () => {
  bar.classList.remove('hidden');
  showTab.classList.remove('show');
});

let lightCol = [1, 0.75, 0.5];
function mix3(a, b, f){
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function updateLight(){
  const t = document.getElementById('lightRange').value / 100;
  const warm = [1.0, 0.62, 0.30], mid = [1.0, 0.92, 0.76], cool = [0.80, 0.88, 1.0];
  lightCol = t < 0.5 ? mix3(warm, mid, t * 2) : mix3(mid, cool, (t - 0.5) * 2);
}
document.getElementById('lightRange').addEventListener('input', updateLight);
updateLight();

/* ---------- 4. 橫放提示遮罩與初始 State 啟動 ---------- */
function updateOrientationAndResize(){
  experienceNow();
  const isLandscape = isLandscapeScreen();
  portraitPaused = !isLandscape;
  pointers.clear();

  if(portraitPaused){
    rotateNotice.classList.add('show');
    return;
  }

  rotateNotice.classList.remove('show');

  if(!experienceStarted){
    resizeCanvas();
    rebuildSim(false);
    experienceStarted = true;
    runNarrativeFlow();
  } else {
    syncViewportAndAspect();
  }
}

window.addEventListener('resize', updateOrientationAndResize);
window.addEventListener('orientationchange', updateOrientationAndResize);
if(window.screen && window.screen.orientation && window.screen.orientation.addEventListener){
  window.screen.orientation.addEventListener('change', updateOrientationAndResize);
}

updateOrientationAndResize();
requestAnimationFrame(frame);
</script>
