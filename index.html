<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>光箱沙畫 · Sand Lightbox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000}
  body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #frame{position:fixed;inset:0;pointer-events:none;z-index:2;
         box-shadow:inset 0 0 90px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.9)}
  #capWrap{position:fixed;top:13%;left:0;right:0;z-index:6;display:flex;flex-direction:column;
       align-items:center;gap:20px;pointer-events:none;opacity:0;transition:opacity 1.2s}
  #cap{color:rgba(255,240,210,.95);font-size:20px;letter-spacing:4px;line-height:2.1;
       text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.75);padding:0 24px}
  #capBtns{display:flex;gap:12px;pointer-events:auto}
  #capBtns button{background:rgba(20,17,14,.72);color:#ffd9a0;border:1px solid rgba(255,255,255,.12);
       border-radius:18px;padding:10px 24px;font-size:15px;letter-spacing:2px;touch-action:manipulation}
  #doneBtn{position:fixed;top:14px;left:14px;z-index:11;background:rgba(20,17,14,.72);color:#ffd9a0;border:1px solid rgba(255,210,150,.28);border-radius:16px;padding:8px 16px;font-size:14px;letter-spacing:2px;display:none;touch-action:manipulation}
  #skipBtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:11;
       background:rgba(20,17,14,.55);color:#cfc6b8;border:1px solid rgba(255,255,255,.1);
       border-radius:14px;padding:6px 14px;font-size:13px;letter-spacing:2px;display:none;
       touch-action:manipulation}
  #toast{position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:30;
        background:rgba(20,17,14,.88);color:#ffd9a0;padding:10px 20px;border-radius:14px;
        font-size:14px;letter-spacing:1px;opacity:0;transition:opacity .4s;
        pointer-events:none;max-width:82%;text-align:center;line-height:1.7}
  #bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));z-index:10;
       transform:translateX(-50%);display:flex;align-items:center;gap:4px;
       background:rgba(20,17,14,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       padding:8px 10px;border-radius:22px;border:1px solid rgba(255,255,255,.09);
       transition:transform .35s,opacity .35s}
  #bar.hidden{transform:translateX(-50%) translateY(calc(100% + 40px));opacity:0;pointer-events:none}
  #bar button{min-width:54px;padding:6px 6px;border-radius:14px;background:transparent;border:none;
       color:#cfc6b8;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:2px;
       touch-action:manipulation}
  #bar button span{font-size:11px;letter-spacing:2px}
  #bar button.on{background:rgba(255,190,110,.22);color:#ffd9a0}
  .sep{width:1px;height:40px;background:rgba(255,255,255,.12);margin:0 4px}
  .lightWrap{display:flex;flex-direction:column;align-items:center;gap:2px;color:#cfc6b8;font-size:15px}
  .lightWrap span{font-size:11px;letter-spacing:2px}
  #lightRange{width:100px;accent-color:#ffbf78}
  #showTab{position:fixed;left:50%;bottom:10px;transform:translateX(-50%) translateY(80px);z-index:10;
       background:rgba(20,17,14,.78);color:#ffd9a0;border:1px solid rgba(255,255,255,.09);
       border-radius:16px;padding:8px 18px;font-size:14px;letter-spacing:2px;
       transition:transform .35s;touch-action:manipulation}
  #showTab.show{transform:translateX(-50%) translateY(0)}
  #err{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
       color:#e8dcc8;font-size:16px;text-align:center;padding:40px;line-height:1.8}
#rotateNotice{display:none;position:fixed;inset:0;z-index:1000;background:#17130f;color:#fff4e2;align-items:center;justify-content:center;text-align:center;padding:32px;line-height:1.9}
#rotateNotice strong{display:block;font-size:26px;margin-bottom:16px}
#rotateNotice p{max-width:24em;font-size:18px;color:#e3d4c0}
@media (orientation:portrait){#rotateNotice{display:flex}}
/* Readable captions: local scrim only; sand and light rendering stay untouched. */
#capWrap{left:50%;right:auto;transform:translateX(-50%);width:max-content;
  max-width:calc(100% - 48px);isolation:isolate;gap:16px}
#capWrap::before{content:"";position:absolute;inset:-28px -54px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(12,9,7,.60) 0%,rgba(12,9,7,.30) 42%,transparent 76%);filter:blur(8px)}
#cap{color:#fff3df;font-size:clamp(22px,2.5vw,26px);font-weight:500;
  letter-spacing:1.5px;line-height:1.8;padding:12px 20px;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.58);transition:filter .6s,opacity 1.2s;
  overflow-wrap:anywhere}
#cap:empty{display:none}
#capBtns{flex-wrap:wrap;justify-content:center}
#capBtns button,#doneBtn,#skipBtn{background:rgba(22,18,14,.94);color:#fff8ed;
  border:1px solid rgba(255,233,196,.45);font-weight:500;min-height:44px}
#capBtns button:focus-visible,#doneBtn:focus-visible,#skipBtn:focus-visible{
  outline:2px solid #fff8ed;outline-offset:4px}
#doneBtn{top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left))}
#skipBtn{right:max(14px,env(safe-area-inset-right))}
@media (max-height:500px) and (orientation:landscape){
  #capWrap{top:52px;max-width:calc(100% - 100px);gap:8px}
  #cap{font-size:22px;line-height:1.55;padding:6px 14px}
  #capBtns button{padding:8px 18px}
}
@media (prefers-reduced-motion:reduce){#capWrap{transition:none}}

  /* soft atmosphere without a physical frame */
  #c{filter:saturate(.94) contrast(1.03)}
</style>
</head>
<body>
<div id="rotateNotice" role="status" aria-live="polite"><div><strong>請將裝置橫放</strong><p>《沙・光箱》以橫向畫面體驗。<br>直放時會暫停，橫放後即可繼續。<br>你的沙畫會保留。</p></div></div>
<canvas id="c"></canvas>
<div id="frame"></div>
<div id="capWrap"><div id="cap"></div><div id="capBtns"></div></div>
<button id="skipBtn">跳過</button>
<button id="doneBtn">完成了</button>
<div id="toast"></div>

<div id="bar">
  <button class="tool on" data-tool="push">✋<span>推沙</span></button>
  <button class="tool" data-tool="pour">⏳<span>灑沙</span></button>
  <div class="sep"></div>
  <button id="guideBtn">🧭<span>引導</span></button>
  <button id="fillBtn">🌘<span>鋪沙</span></button>
  <button id="clearBtn">🗑️<span>清空</span></button>
  <button id="saveBtn">📷<span>儲存</span></button>
  <button id="fsBtn">⛶<span>全螢幕</span></button>
  <div class="sep"></div>
  <div class="lightWrap">💡<input id="lightRange" type="range" min="0" max="100" value="30"><span>燈光</span></div>
  <button id="hideBtn">▾<span>收起</span></button>
</div>
<button id="showTab">🛠️ 工具</button>
<div id="err"></div>

<script>
"use strict";
/* ================= 可調參數 ================= */
const CONFIG = {
  SIM_MAX: 896,      // 沙層模擬網格的最大邊長
  TALUS: 0.008,      // 安息角：越大沙堆越穩定
  FLOW: 0.08,        // 沙流動的速度（穩定上限 0.25）
  RELAX_STEPS: 3,
  SETTLE_STEPS: 2,
  SETTLE_RATE: 0.0,    // 每幀鬆弛迭代次數
  BRUSH_R: 0.05,     // 筆刷半徑（螢幕短邊比例）
  PUSH: 0.9,         // 推沙強度
  POUR: 1.3,         // 灑沙速率
  BASE: 0.12,        // 鋪沙的基礎厚度
  BASE_NOISE: 0.02,  // 鋪沙的不均勻度
  ABSORB: 6.0,       // 燈箱吸光係數：越大對比越強
  WIND_DUR: 6.0,     // 風的持續秒數
  DRAW_TIME: 25,     // 引導：開始作畫後給多少秒（第一輪）
  DRAW_MORE: 12,     // 引導：選「還沒」後再給多少秒
};
/* ============================================ */

let portraitPaused=innerHeight>innerWidth;
let activeTime=0, clockLast=performance.now();
function experienceNow(){
  const now=performance.now();
  if(!portraitPaused) activeTime+=Math.max(0,now-clockLast);
  clockLast=now;
  return activeTime;
}
let experienceStarted=false;
const canvas = document.getElementById('c');
const errBox = document.getElementById('err');
function fail(msg){ errBox.style.display='flex'; errBox.textContent=msg; throw new Error(msg); }

const gl = canvas.getContext('webgl2', {alpha:false, antialias:false, depth:false, stencil:false, powerPreference:'high-performance'});
if(!gl) fail('此瀏覽器不支援 WebGL2。請將 iPad 更新到 iPadOS 15 以上，或使用 Safari。');
const useFloat = !!gl.getExtension('EXT_color_buffer_float');

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);

/* ---------- shader 編譯 ---------- */
function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader 錯誤: ' + gl.getShaderInfoLog(s));
  return s;
}
function prog(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Link 錯誤: ' + gl.getProgramInfoLog(p));
  return p;
}
function locs(p, names){ const o={}; names.forEach(n=>o[n]=gl.getUniformLocation(p,n)); return o; }

const VS = "#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.,1.);}";

/* ---------- 沙層模擬（高度場 + 安息角 + 線段筆刷 + 風） ---------- */
const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev;
uniform vec2  uSimSize;
uniform vec2  uWind;       // 風向*強度(0..1)
uniform float uTalus, uFlow, uTime, uDt, uSettleRate;
uniform int   uCount;
uniform vec4  uBrush[10];
uniform vec4  uBrushPrev[10];
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float windFlux(vec2 cell){
  if(any(lessThan(cell,vec2(0.5))) || any(greaterThan(cell,uSimSize-0.5))) return 0.0;
  float h=texture(uPrev,cell/uSimSize).r;
  float upstream=texture(uPrev,(cell-vec2(2.,0.))/uSimSize).r;
  float ridge=smoothstep(0.,0.045,max(0.,h-upstream));
  float bands=0.45+0.55*pow(0.5+0.5*sin(cell.y*0.075+sin(cell.y*0.021)+uTime*0.6),2.);
  float gust=0.65+0.35*sin(cell.x*0.023-uTime*2.4+cell.y*0.013);
  float rate=min(0.18,length(uWind)*uDt*(3.0+ridge*8.0)*bands*gust);
  return h*rate;
}
void main(){
  vec2 uv = gl_FragCoord.xy/uSimSize;
  vec2 tx = 1.0/uSimSize;
  float h  = texture(uPrev, uv).r;
  float hN = texture(uPrev, uv+vec2(0.,tx.y)).r;
  float hS = texture(uPrev, uv-vec2(0.,tx.y)).r;
  float hE = texture(uPrev, uv+vec2(tx.x,0.)).r;
  float hW = texture(uPrev, uv-vec2(tx.x,0.)).r;

  // 安息角鬆弛
  float fN=max(0.,h-hN-uTalus), fS=max(0.,h-hS-uTalus);
  float fE=max(0.,h-hE-uTalus), fW=max(0.,h-hW-uTalus);
  float outSum=fN+fS+fE+fW;
  float cap = outSum>h ? h/outSum : 1.0;
  float iN=min(hN,max(0.,hN-h-uTalus)), iS=min(hS,max(0.,hS-h-uTalus));
  float iE=min(hE,max(0.,hE-h-uTalus)), iW=min(hW,max(0.,hW-h-uTalus));
  float nh = h - uFlow*cap*outSum + uFlow*(iN+iS+iE+iW);

  vec2 px = uv*uSimSize;

    // 自然沉降：只在接近安息角的局部區域發生，避免整屏抖動
  float slope=max(max(h-hN,h-hS),max(h-hE,h-hW));
  float unstable=smoothstep(uTalus*0.35,uTalus*1.8,slope);
  float field=hash21(floor(px*0.22)+floor(uTime*0.55)*17.3);
  float settle=unstable*step(0.72,field)*uSettleRate*uDt;
  if(settle>0.0){
    vec2 down=normalize(vec2((hW-hE),(hS-hN))+vec2(0.0001));
    vec2 src=clamp(uv-down*tx*(0.8+field*2.2),vec2(0.002),vec2(0.998));
    float incoming=texture(uPrev,src).r;
    nh=mix(nh,incoming,settle*8.0);
  }

  // Move a fraction of surface sand rightward; closed edges preserve sand mass.
  if(length(uWind)>0.001){
    vec2 hop=vec2(3.0,0.0);
    float outgoing=px.x+hop.x<=uSimSize.x-0.5 ? windFlux(px) : 0.0;
    float incoming=windFlux(px-hop);
    nh=max(0.0,nh+incoming-outgoing);
  }

  // 手指筆刷
  for(int i=0;i<10;i++){
    if(i>=uCount) break;
    vec4 b=uBrush[i], bp=uBrushPrev[i];
    vec2 c=b.xy*uSimSize, cp=bp.xy*uSimSize;
    float rad=b.z, str=b.w;
    int mode=int(bp.z+0.5);
    vec2 ba=c-cp;
    float tt=clamp(dot(px-cp,ba)/max(dot(ba,ba),1e-4),0.,1.);
    float dist=length(px-(cp+ba*tt));
    float fall=1.0-smoothstep(rad*0.3, rad, dist);
    if(fall<=0.001) continue;
    if(mode==0){
      float mv=clamp(length(ba)*0.15, 0., 1.);
      float moving=clamp(mv*8.0, 0., 1.);
      float act=str*moving*(0.35+0.65*clamp(mv*3.0,0.,1.));
      float dn=dist/rad;
      float core=1.0-smoothstep(0.15,0.8,dn);
      float ring=smoothstep(0.5,0.75,dn)*(1.0-smoothstep(0.8,1.0,dn));
      nh *= 1.0 - core*act;
      nh += ring*act*0.28*h;
    } else {
      float g=hash21(px*0.9+floor(uTime*50.)*13.7);
      float grain=smoothstep(0.35,0.8,g);
      nh+=str*fall*grain*uDt;
    }
  }
  o=vec4(clamp(nh,0.,2.5),0.,0.,1.);
}`;

/* ---------- 燈箱渲染 ---------- */
const REND_FS = `#version 300 es
precision highp float;
uniform sampler2D uHeight;
uniform vec2  uCanvas, uSimSize;
uniform vec3  uLight;
uniform float uTime, uAbsorb;
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
void main(){
  vec2 uv = gl_FragCoord.xy/uCanvas;
  vec2 tx = 1.0/uSimSize;
  float h  = texture(uHeight, uv).r;
  float hE = texture(uHeight, uv+vec2(tx.x,0.)).r;
  float hW = texture(uHeight, uv-vec2(tx.x,0.)).r;
  float hN = texture(uHeight, uv+vec2(0.,tx.y)).r;
  float hS = texture(uHeight, uv-vec2(0.,tx.y)).r;
  float hb = (texture(uHeight,uv+tx*1.5).r+texture(uHeight,uv-tx*1.5).r
             +texture(uHeight,uv+vec2(tx.x,-tx.y)*1.5).r+texture(uHeight,uv+vec2(-tx.x,tx.y)*1.5).r)*0.25;
  float hh = mix(h,hb,0.25);

  float presence = smoothstep(0.004,0.05,h);

  vec2 grad = vec2(hE-hW, hN-hS);
  vec3 n = normalize(vec3(-grad*50.0, 1.0));
  vec3 L = normalize(vec3(-0.45,0.5,0.62));
  float diff = clamp(dot(n,L), 0., 1.);

  vec2 ld = normalize(vec2(-0.55,0.7));
  float s1 = max(0.0, texture(uHeight, uv+ld*tx*2.0).r - h);
  float s2 = max(0.0, texture(uHeight, uv+ld*tx*5.0).r - h);
  float s3 = max(0.0, texture(uHeight, uv+ld*tx*9.0).r - h);
  float shadow = 1.0 - clamp((s1 + s2*0.7 + s3*0.45)*18.0, 0.0, 0.5);

  float intensity = 0.05 + 1.35*exp(-uAbsorb*hh);
  vec3 col = uLight * intensity;
  col *= mix(vec3(1.0), vec3(0.86,0.78,0.66), presence*0.85);
  col *= mix(1.0, 0.7+0.6*diff, presence);
  col *= mix(1.0, shadow, presence);
  col += uLight * exp(-uAbsorb*hb) * 0.25 * (1.0 - 0.6*presence);

  vec2 gp = uv*uSimSize;
  float g = hash21(floor(gp));
  float fine = hash21(floor(gp*2.7+vec2(13.1,7.4)));
  col *= 1.0 + (g-0.5)*0.22*presence;
  col *= 1.0 + (fine-0.5)*0.055*presence;
  float sp = hash21(floor(gp)+floor(uTime*7.0)*7.13);
  float tw = 0.5+0.5*sin(uTime*4.0+sp*60.0);
  col += uLight * step(0.997,sp)*tw*presence*0.8;

  col *= 0.94 + 0.06*sin(uv.x*3.7+1.0)*sin(uv.y*2.9+2.0);
  float d = distance(uv, vec2(0.5));
  col *= 1.0 - 0.32*smoothstep(0.45,0.85,d);
  col = pow(col, vec3(0.9));
  o = vec4(col,1.0);
}`;

/* ---------- 鋪沙 ---------- */
const FILL_FS = `#version 300 es
precision highp float;
uniform float uBase,uAmp,uSeed;
out vec4 o;
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  float a=hash21(i), b=hash21(i+vec2(1.,0.)), c=hash21(i+vec2(0.,1.)), d=hash21(i+vec2(1.,1.));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
void main(){
  vec2 p=gl_FragCoord.xy;
  float m1=vnoise(p*0.05+uSeed);
  float m2=vnoise(p*0.22+uSeed*2.7);
  float g =hash21(p+uSeed);
  float h=uBase + (m1-0.5)*uAmp*3.0 + (m2-0.5)*uAmp*1.2 + (g-0.5)*uAmp*0.7;
  o=vec4(max(h,0.0),0.,0.,1.);
}`;

const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D uSrc; uniform vec2 uDest;
out vec4 o;
void main(){ o=vec4(texture(uSrc, gl_FragCoord.xy/uDest).r,0.,0.,1.); }`;

const sp = prog(VS, SIM_FS),  SL = locs(sp, ['uPrev','uSimSize','uWind','uTalus','uFlow','uTime','uDt','uCount','uBrush','uBrushPrev','uSettleRate']);
const rp = prog(VS, REND_FS), RL = locs(rp, ['uHeight','uCanvas','uSimSize','uLight','uTime','uAbsorb']);
const fp = prog(VS, FILL_FS), FL = locs(fp, ['uBase','uAmp','uSeed']);
const cp = prog(VS, COPY_FS), CL = locs(cp, ['uSrc','uDest']);

/* ---------- 紋理 / 幀緩衝 ---------- */
let simW=0, simH=0, tex=null, ri=0;
function makeTarget(){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(useFloat) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,simW,simH,0,gl.RGBA,gl.HALF_FLOAT,null);
  else         gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,simW,simH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  const f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) fail('Framebuffer 不完整');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex:t, fbo:f};
}
function fillTarget(tgt, seed){
  gl.bindFramebuffer(gl.FRAMEBUFFER,tgt.fbo);
  gl.viewport(0,0,simW,simH);
  gl.useProgram(fp);
  gl.uniform1f(FL.uBase,CONFIG.BASE); gl.uniform1f(FL.uAmp,CONFIG.BASE_NOISE); gl.uniform1f(FL.uSeed,seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function copyInto(src,dst){
  gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fbo);
  gl.viewport(0,0,simW,simH);
  gl.useProgram(cp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src.tex);
  gl.uniform1i(CL.uSrc,0); gl.uniform2f(CL.uDest,simW,simH);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function fillBoth(){ fillTarget(tex[0],1.0); fillTarget(tex[1],1.0); }
function clearAll(){
  for(const t of tex){
    gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  }
}
function initSimSize(){
  const aspect = innerWidth/Math.max(1,innerHeight);
  if(aspect>=1){ simW=CONFIG.SIM_MAX; simH=Math.max(64,Math.round(CONFIG.SIM_MAX/aspect)); }
  else{ simH=CONFIG.SIM_MAX; simW=Math.max(64,Math.round(CONFIG.SIM_MAX*aspect)); }
}
function rebuildSim(keep){
  const old = tex, oldRi = ri;
  initSimSize();
  tex=[makeTarget(),makeTarget()]; ri=0;
  if(keep && old){ copyInto(old[oldRi],tex[0]); copyInto(tex[0],tex[1]);
    old.forEach(t=>{gl.deleteTexture(t.tex);gl.deleteFramebuffer(t.fbo);});
  } else fillBoth();
}
function resizeCanvas(){
  const dpr=Math.min(devicePixelRatio||1,2);
  let w=Math.round(innerWidth*dpr), h=Math.round(innerHeight*dpr);
  const cap=3500000;
  if(w*h>cap){ const s=Math.sqrt(cap/(w*h)); w=Math.round(w*s); h=Math.round(h*s); }
  canvas.width=w; canvas.height=h;
}

/* ---------- 多點觸控 ---------- */
const pointers=new Map();
let tool='push';
const TOOL_ID={push:0,pour:1};
function toUV(e){
  const r=canvas.getBoundingClientRect();
  return {u:(e.clientX-r.left)/r.width, v:1-(e.clientY-r.top)/r.height};
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(portraitPaused || !experienceStarted)return;
  canvas.setPointerCapture(e.pointerId);
  const {u,v}=toUV(e);
  pointers.set(e.pointerId,{u,v,pu:u,pv:v});
});
canvas.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId); if(!p) return;
  const {u,v}=toUV(e); p.u=u; p.v=v;
});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>
  canvas.addEventListener(t,e=>pointers.delete(e.pointerId)));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- 風 ---------- */
let windStart=0, ambientStart=0, nextGust=0, drawingPhase=false, finishRequested=false;
function windLevel(now){
  if(!windStart){
    if(!drawingPhase || !drawStart) return 0;
    if(!nextGust) nextGust=now+6;
    if(!ambientStart && now>=nextGust) ambientStart=now;
    if(!ambientStart) return 0;
    const t=(now-ambientStart)/4.5;
    if(t>=1){ ambientStart=0; nextGust=now+5+Math.random()*4; return 0; }
    return 0.8*Math.sin(Math.PI*Math.max(0,t));
  }
  const t=(now-windStart)/CONFIG.WIND_DUR;
  if(t>=1){ windStart=0; return 0; }
  if(t<=0) return 0;
  return 2.0*Math.sin(Math.PI*t);
}

/* ---------- 主迴圈 ---------- */
let lastT=0;
function step(){
  gl.bindFramebuffer(gl.FRAMEBUFFER,tex[1-ri].fbo);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex[ri].tex);
  gl.drawArrays(gl.TRIANGLES,0,3);
  ri=1-ri;
}
function render(now){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(rp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex[ri].tex);
  gl.uniform1i(RL.uHeight,0);
  gl.uniform2f(RL.uCanvas,canvas.width,canvas.height);
  gl.uniform2f(RL.uSimSize,simW,simH);
  gl.uniform3f(RL.uLight,lightCol[0],lightCol[1],lightCol[2]);
  gl.uniform1f(RL.uTime,now);
  gl.uniform1f(RL.uAbsorb,CONFIG.ABSORB);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function frame(nowMs){
  requestAnimationFrame(frame);
  if(portraitPaused || !experienceStarted){lastT=0;return;}
  const now=experienceNow()/1000;
  const dt=Math.min(0.033, lastT? now-lastT : 0.016); lastT=now;

  if(drawingPhase && pointers.size>0) drawnTime+=dt;
  if(drawingPhase && !drawStart && drawnTime>0.5) drawStart=now;

  const b=new Float32Array(40), bp=new Float32Array(40);
  let n=0;
  const baseR=CONFIG.BRUSH_R*Math.min(simW,simH);
  const rad = tool==='pour'? baseR*1.3 : baseR;
  const str = tool==='push'? CONFIG.PUSH : CONFIG.POUR;
  pointers.forEach(p=>{
    if(n>=10) return;
    b.set([p.u,p.v,rad,str],n*4);
    bp.set([p.pu,p.pv,TOOL_ID[tool],0],n*4);
    n++;
  });
  pointers.forEach(p=>{p.pu=p.u;p.pv=p.v;});

  gl.useProgram(sp);
  gl.viewport(0,0,simW,simH);
  gl.uniform1i(SL.uPrev,0);
  gl.uniform2f(SL.uSimSize,simW,simH);
  const wl=windLevel(now);
  gl.uniform2f(SL.uWind, wl, wl*0.12);
  gl.uniform1f(SL.uTalus,CONFIG.TALUS);
  gl.uniform1f(SL.uFlow,CONFIG.FLOW);
  gl.uniform1f(SL.uTime,now);
  gl.uniform1f(SL.uDt,dt);
  gl.uniform1f(SL.uSettleRate,CONFIG.SETTLE_RATE);
  gl.uniform4fv(SL.uBrush,b);
  gl.uniform4fv(SL.uBrushPrev,bp);
  gl.uniform1i(SL.uCount,n);
  step();
  gl.uniform1i(SL.uCount,0);
  gl.uniform2f(SL.uWind,0,0);
  for(let i=0;i<CONFIG.RELAX_STEPS;i++) step();
  render(now);
}

/* ---------- 引導流程 ---------- */
const capWrap=document.getElementById('capWrap');
const cap=document.getElementById('cap');
const capBtns=document.getElementById('capBtns');
const skipBtn=document.getElementById('skipBtn');
let guiding=false, gVer=0, drawnTime=0, drawStart=0;
const doneBtn=document.getElementById("doneBtn");

function setCap(t){ cap.innerHTML=t.replace(/\n/g,'<br>'); capWrap.style.opacity='1'; }
function clearCap(){ capWrap.style.opacity='0'; }
function setBtns(list){
  capBtns.innerHTML='';
  for(const [label,cb] of list){
    const b=document.createElement('button');
    b.textContent=label;
    b.addEventListener('click',cb);
    capBtns.appendChild(b);
  }
}
const wait=ms=>new Promise(resolve=>{
  const end=experienceNow()+ms;
  const id=setInterval(()=>{if(!portraitPaused && experienceNow()>=end){clearInterval(id);resolve();}},60);
});
function waitUntil(pred, ok){
  return new Promise(res=>{
    const iv=setInterval(()=>{
      if(!ok()){ clearInterval(iv); res(false); }
      else if(!portraitPaused && pred()){ clearInterval(iv); res(true); }
    },120);
  });
}
function ask(opts){
  return new Promise(res=>{
    setBtns(opts.map(o=>[o[0],()=>{ setBtns([]); res(o[1]); }]));
  });
}
function enterFree(){
  guiding=false; drawingPhase=false; windStart=0; ambientStart=0; nextGust=0;
  skipBtn.style.display="none"; doneBtn.style.display="none";
  showTab.style.display='';
  clearCap(); setBtns([]);
  bar.classList.remove('hidden');
  setCap('自由發揮');
  setTimeout(()=>{ if(!guiding) clearCap(); },2600);
  toast('可隨時以工具列的 🧭 引導 重新進入引導');
}
function finishDrawing(){
  if(!guiding || !drawingPhase || finishRequested) return;
  finishRequested=true; drawingPhase=false; ambientStart=0;
  doneBtn.style.display="none"; setBtns([]);
  setCap('完成了。\n先看看你留下的畫面。');
}
doneBtn.addEventListener("click",finishDrawing);
function startGuide(){
  fillBoth(); drawnTime=0; drawStart=0; windStart=0;
  ambientStart=0; nextGust=0; drawingPhase=true; finishRequested=false; setBtns([]);
  guiding=true;
  bar.classList.remove('hidden');   // 引導期間也保留完整工具
  showTab.style.display='';
  skipBtn.style.display="block"; doneBtn.style.display="none";
  guide();
}
skipBtn.addEventListener('click',()=>{ gVer++; enterFree(); });
document.getElementById('guideBtn').addEventListener('click',()=>{ startGuide(); });

async function guide(){
  const v=++gVer; const ok=()=>v===gVer&&guiding;
  await wait(900); if(!ok())return;

  setCap('想起你最珍視的關係、事物。\n用沙，建構那幅圖畫。');
  const reached=await waitUntil(()=>drawStart>0 && experienceNow()/1000-drawStart>=CONFIG.DRAW_TIME,ok);
  if(!reached||!ok())return;
  setCap('完成了嗎？\n這是否你珍視、想留住的畫面？');
  const ans=await ask([['還沒，繼續','more'],['完成了','done']]);
  if(!ok())return;
  if(ans==='more'){
    doneBtn.style.display='block';
    setCap('慢慢來，不急。');
    setTimeout(()=>{if(ok()&&drawingPhase)clearCap();},3500);
    const finished=await waitUntil(()=>finishRequested,ok);
    if(!finished||!ok())return;
  }else finishDrawing();
  drawingPhase=false; ambientStart=0; nextGust=0;
  doneBtn.style.display='none';
  await wait(1400); if(!ok())return;

  clearCap(); await wait(800); if(!ok())return;
  setCap('沙是暫存的。\n萬物都有定時，\n我們無法控制它何時轉變。');
  await wait(4600); if(!ok())return;
  clearCap(); await wait(700); if(!ok())return;

  windStart=experienceNow()/1000;           // 結尾強風：搬運表層沙，而非清空
  await wait(CONFIG.WIND_DUR*1000+400); if(!ok())return;

  setCap('在你還未留意的時候，\n光就一直在為你亮著；\n風帶走一切之後，\n它仍然亮著。');
  await wait(6500); if(!ok())return;
  clearCap(); await wait(1000); if(!ok())return;

  setCap('是否有什麼，\n是時間帶不走的？');
  await wait(7000); if(!ok())return;          // 留白
  clearCap(); await wait(1300); if(!ok())return;

  setCap('就像神，那道永恆的光，\n一直在為你亮著。');
  await wait(5200); if(!ok())return;
  clearCap(); await wait(900); if(!ok())return;

  capWrap.style.opacity='1';
  setBtns([['再來一次',()=>{ setBtns([]); startGuide(); }],
           ['自由發揮',()=>{ setBtns([]); enterFree(); }]]);
}

/* ---------- UI ---------- */
const bar=document.getElementById('bar'), showTab=document.getElementById('showTab');
const toastEl=document.getElementById('toast');
let toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.style.opacity='0',3800);
}

document.querySelectorAll('#bar .tool').forEach(btn=>{
  btn.addEventListener('click',()=>{
    tool=btn.dataset.tool;
    document.querySelectorAll('#bar .tool').forEach(x=>x.classList.toggle('on',x===btn));
  });
});
document.getElementById('fillBtn').addEventListener('click',()=>fillBoth());
document.getElementById('clearBtn').addEventListener('click',()=>clearAll());
document.getElementById('saveBtn').addEventListener('click',()=>{
  render(experienceNow()/1000);
  const d=new Date(), pad=x=>String(x).padStart(2,'0');
  const a=document.createElement('a');
  a.download=`sand-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.png`;
  a.href=canvas.toDataURL('image/png');
  a.click();
});

/* ---------- 全螢幕 ---------- */
const fsBtn=document.getElementById('fsBtn');
function fsElement(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function zenFallback(){
  bar.classList.add('hidden'); showTab.classList.add('show');
  toast('此裝置不支援網頁全螢幕，已隱藏工具列。iPhone 請用「分享 → 加入主畫面」，從主畫面開啟即為全螢幕。');
}
fsBtn.addEventListener('click',()=>{
  if(fsElement()){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    return;
  }
  const el=document.documentElement;
  let p=null;
  try{
    if(el.requestFullscreen) p=el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  if(p&&p.then) p.catch(()=>zenFallback());
  setTimeout(()=>{ if(!fsElement()) zenFallback(); },500);
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>addEventListener(ev,()=>{
  const on=!!fsElement();
  fsBtn.innerHTML=(on?'✕':'⛶')+'<span>'+(on?'退出':'全螢幕')+'</span>';
}));

document.getElementById('hideBtn').addEventListener('click',()=>{bar.classList.add('hidden');showTab.classList.add('show');});
showTab.addEventListener('click',()=>{bar.classList.remove('hidden');showTab.classList.remove('show');});

let lightCol=[1,0.75,0.5];
function mix3(a,b,f){return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];}
function updateLight(){
  const t=document.getElementById('lightRange').value/100;
  const warm=[1.0,0.62,0.30], mid=[1.0,0.92,0.76], cool=[0.80,0.88,1.0];
  lightCol = t<0.5 ? mix3(warm,mid,t*2) : mix3(mid,cool,(t-0.5)*2);
}
document.getElementById('lightRange').addEventListener('input',updateLight);
updateLight();

/* ---------- 啟動 ---------- */
function updateOrientation(){
  experienceNow();
  portraitPaused=innerHeight>innerWidth;
  pointers.clear();
  if(portraitPaused)return;
  if(!experienceStarted){
    resizeCanvas(); rebuildSim(false); experienceStarted=true; startGuide();
  }else{
    // Keep the original simulation and canvas aspect ratio; never resample the artwork.
    const scale=Math.min(innerWidth/canvas.width,innerHeight/canvas.height);
    canvas.style.width=(canvas.width*scale)+'px';
    canvas.style.height=(canvas.height*scale)+'px';
    canvas.style.left=((innerWidth-canvas.width*scale)/2)+'px';
    canvas.style.top=((innerHeight-canvas.height*scale)/2)+'px';
    canvas.style.right='auto';canvas.style.bottom='auto';
  }
}
addEventListener('resize',updateOrientation);
updateOrientation();
requestAnimationFrame(frame);
</script>
